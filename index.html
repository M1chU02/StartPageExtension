<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/img/home-favicon.png" />

    <link
      href="https://fonts.googleapis.com/css?family=Gruppo"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Chakra Petch"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <link rel="stylesheet" href="/style/style.css" />
    <link rel="stylesheet" href="/style/socialsstyle.css" />
    <link rel="stylesheet" href="/style/bookmarksstyle.css" />
    <link rel="stylesheet" href="style/notepadstyle.css" />
    <link rel="stylesheet" href="/style/settingsstyle.css" />
    <link rel="stylesheet" href="/style/gamestodolist.css">
    <link rel="stylesheet" id="themestylesheet" href="/themes/dark-mode.css" />

    <title>HomePage</title>
  </head>
  <body>
    <button id="recent-tabs-button">History</button>
    <ul id="recent-tabs-list"></ul>
    <!--<div id="particles-js"></div>!-->
    <div id="header-info">
      <div id="headerdiv">
        <h2 class="header" id="nameheader"></h2>
        <h2 class="header" id="greetingsheader"></h2>
      </div>

      <div id="infodiv">
        <div id="datediv">
          <p class="paragraph" id="date"></p>
          <p class="paragraph" id="hour"></p>
        </div>
        <div id="separatordiv">
          <p class="paragraph" id="separatorchar">|</p>
        </div>
        <div id="weatherdiv" class="offline">
          <p class="paragraph" id="temperature"></p>
          <p class="paragraph" id="city"></p>
          <a href="#" id="extendedWeatherLink" target="_blank" title="View Extended Forecast" class="weather-link">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24px" height="24px" class="weather-icon">
              <path d="M13 3l3.293 3.293-7 7 1.414 1.414 7-7L21 11V3z"/>
              <path d="M19 19H5V5h7l-2-2H5c-1.103 0-2 .897-2 2v14c0 1.103.897 2 2 2h14c1.103 0 2-.897 2-2v-5l-2-2v7z"/>
            </svg>
          </a>
        </div>
        <div id="offlinediv" style="display: none">
          <p class="paragraph">You're offline.</p>
        </div>
      </div>
    </div>

    <div id="searchdiv">
      <form id="searchform">
        <input type="text" id="searchinput" placeholder="Search..." autocomplete="off">
        <button type="button" id="voiceSearchBtn" title="Search by voice">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
      </form>
    </div>

    <div id="bookmarksdiv" class="offline">
      <h1>Bookmarks</h1>
      <div id="bookmark-list"></div>

      <button id="add-button">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          x="0px"
          y="0px"
          viewBox="0 0 24 24"
        >
          <path
            d="M 11 2 L 11 11 L 2 11 L 2 13 L 11 13 L 11 22 L 13 22 L 13 13 L 22 13 L 22 11 L 13 11 L 13 2 Z"
          ></path>
        </svg>
      </button>
    </div>

    <div id="content">
      <div id="allnews" class="offline">
        <div id="newsselection">
          <label id="localNewsLabel">
            <input
              value="value-1"
              name="value-radio"
              id="value-1"
              type="radio"
            />
            <span>Local News</span>
          </label>
          <button id="refreshNewsBtn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              x="0px"
              y="0px"
              width="30"
              height="30"
              viewBox="0 0 30 30"
            >
              <use xlink:href="/svg/newssvg/refresh.svg#refresh"></use>
            </svg>
          </button>
          <label id="globalNewsLabel">
            <input
              value="value-2"
              name="value-radio"
              id="value-2"
              type="radio"
            />
            <span>Global News</span>
          </label>
        </div>
        <hr />
        <div class="newsdivs" id="newsdiv"></div>
        <div class="newsdivs" id="worldnewsdiv"></div>
      </div>

      <div id="socials-apps">
        <div id="socialsdiv" class="offline">
          <div class="up">
            <button class="card1" id="card1" title="Instagram">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0,0,48,48"
                width="30px"
                height="30px"
                class="instagram"
              >
                <use xlink:href="/svg/socialsvg/instagram.svg#instagram" />
              </svg>
            </button>
            <button class="card2" id="card2" title="Twitter">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                xmlns:xlink="http://www.w3.org/1999/xlink"
                id="Layer_1"
                viewBox="0 0 24 24"
                width="30px"
                height="30px"
                class="twitter"
              >
                <use xlink:href="/svg/socialsvg/twitter.svg#twitter" />
              </svg>
            </button>
          </div>

          <button class="centerCard" id="centerCard" title="Spotify">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              x="0px"
              y="0px"
              width="40px"
              height="40px"
              viewBox="0 0 50 50"
              class="spotify"
            >
              <use xlink:href="/svg/socialsvg/spotify.svg#spotify" />
            </svg>
          </button>

          <div class="down">
            <button class="card3" id="card3" title="Github">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 48 48"
                width="30px"
                height="30px"
                class="github"
              >
                <use xlink:href="/svg/socialsvg/github.svg#github" />
              </svg>
            </button>
            <button class="card4" id="card4" title="Youtube">
              <svg
                height="30px"
                width="30px"
                viewBox="0 0 48 48"
                xmlns="http://www.w3.org/2000/svg"
                class="youtube"
              >
                <use xlink:href="/svg/socialsvg/youtube.svg#youtube" />
              </svg>
            </button>
          </div>
        </div>

        <div id="appsdiv">
          <button id="timerBtn" title="Timer" class="appbutton">
            <svg
              height="32px"
              width="32px"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              class="appsvg"
            >
              <use xlink:href="/svg/appsvg/timer.svg#timer" />
            </svg>
            Timer
          </button>
          <button id="calendarBtn" title="Calendar" class="appbutton">
            <svg
              height="32px"
              width="32px"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              class="appsvg"
            >
              <use xlink:href="/svg/appsvg/calendar.svg#calendar" />
            </svg>
            Calendar
          </button>
          <button id="calculatorBtn" title="Calculator" class="appbutton">
            <svg
              height="32px"
              width="32px"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              class="appsvg"
            >
              <use xlink:href="/svg/appsvg/calculator.svg#calculator" />
            </svg>
            Calculator
          </button>
          <button
            id="translatorBtn"
            title="Translator"
            class="appbutton offline"
          >
            <svg
              height="32px"
              width="32px"
              xmlns="http://www.w3.org/2000/svg"
              xmlns:xlink="http://www.w3.org/1999/xlink"
              viewBox="0 0 48 48"
              class="appsvg"
            >
              <use xlink:href="/svg/appsvg/translator.svg#translator" />
            </svg>
            Translator
          </button>
        </div>
      </div>

      <div id="gamesnotepadtodolist">
        <div id="navbar">
          <button id="nav-games-btn" class="button">Games</button>
          <button id="nav-notepad-btn" class="button">Notepad</button>
          <button id="nav-todolist-btn" class="button">To Do List</button>
        </div>

  <!-- Notepad Section (visible by default) -->
  <div id="notepaddiv">
    <div id="notepad-navbar">
      <div id="note-list"></div>
      <button id="add-note-btn">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          x="0px"
          y="0px"
          viewBox="0 0 24 24"
          width="24"
          height="24"
        >
          <path
            d="M 11 2 L 11 11 L 2 11 L 2 13 L 11 13 L 11 22 L 13 22 L 13 13 L 22 13 L 22 11 L 13 11 L 13 2 Z"
          ></path>
        </svg>
      </button>
    </div>
    <hr />
    <div id="notepadarea" contenteditable="true" data-placeholder="Make a note..."></div>
    <div id="editor-buttons">
      <div id="basic-text-editor">
        <button id="notepadboldbtn"><strong>B</strong></button>
        <button id="notepaditalicbtn"><em>I</em></button>
        <button id="notepadunderlinebtn"><u>U</u></button>
        <label for="fontSize">Font Size:</label>
        <select id="fontSize">
          <option value="16px">16px</option>
          <option value="20px">20px</option>
          <option value="24px">24px</option>
          <option value="28px">28px</option>
          <option selected value="36px">36px</option>
          <option value="48px">48px</option>
        </select>
      </div>
      <div id="advanced-text-editor">
        <button id="notepadlistbtn">&#8226; List</button>
        <button id="notepadcheckbtn">☑ Checkbox</button>
      </div>
    </div>
    <div id="savenotesbtn">
      <div class="loader-container">
        <div class="loader"></div>
        <span>Save notes</span>
      </div>
    </div>
  </div>

  <!-- Game Section (hidden by default) -->
  <div id="gameselectdiv" style="display: none;">
    <h1>Games</h1>
    <div id="gameiconsgrid">
      <div class="gameicon" style="background-color: red; padding: 20px;">Game 1</div>
      <div class="gameicon" style="background-color: green; padding: 20px;">Game 2</div>
      <div class="gameicon" style="background-color: blue; padding: 20px;">Game 3</div>
      <div class="gameicon" style="background-color: yellow; padding: 20px;">Game 4</div>
    </div>
    <!-- <a href="steam://run/670290">Launch Dota 2</a> -->
  </div>

  <!-- To-Do List Section (hidden by default) -->
  <div id="todolistdiv" style="display: none;">
    <div id="todolistnav">
        <!-- Select to choose between lists -->
        <select id="listSelector"></select>
        <!-- Button to add a new list -->
        <button id="addListBtn">
          <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" viewBox="0 0 24 24" width="24" height="24">
            <path d="M 11 2 L 11 11 L 2 11 L 2 13 L 11 13 L 11 22 L 13 22 L 13 13 L 22 13 L 22 11 L 13 11 L 13 2 Z"></path>
          </svg>
        </button>
        <!-- Button to reorder lists -->
        <button id="reorderListBtn" class="reorder-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <!-- Button to open list settings -->
        <button id="todoSettingsBtn">
          <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" width="24" height="24">
            <path d="M140,128a12,12,0,1,1-12-12A12,12,0,0,1,140,128ZM128,72a12,12,0,1,0-12-12A12,12,0,0,0,128,72Zm0,112a12,12,0,1,0,12,12A12,12,0,0,0,128,184Z"></path>
          </svg>
        </button> 
    </div>
    <hr>
    <!-- Editable To-Do list -->
    <div id="todolist">
        <ul contenteditable="true" data-placeholder="Type a task and press Enter"></ul>
    </div>
    <!-- Button to save list to localStorage -->
    <button id="saveBtn">Save List</button>
  </div>
      </div>

    <div id="footer">
      <button id="settingsBtn">
        <a>Settings</a>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          x="0px"
          y="0px"
          width="36px"
          height="36px"
          viewBox="0 0 50 50"
          class="settingssvg"
        >
          <use xlink:href="/svg/settingssvg/settings.svg#settings" />
        </svg>
      </button>

      <button id="focusmodeBtn">
        <a>Focus Mode</a>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="36px"
          height="36px"
          viewBox="0 0 335.522 335.522"
          class="settingssvg"
        >
          <use xlink:href="/svg/settingssvg/zen.svg#zen" />
        </svg>
      </button>
    </div>



    <div id="socialsSitesList" style="display: none;">
      <h2>Choose a site</h2>
      <ul></ul>
    </div>
    <!--<script src="/cdn/particles.min.js"></script>
    <script src="/cdn/particles.js"></script>!-->

    <script src="/script/marked.min.js"></script>
    <script src="/winbox/winbox.bundle.min.js"></script>

    
    <script src="/script/settings.js"></script>
    <script src="script/background.js"></script>
    <script src="/script/offline.js"></script>
    <script src="/script/voice-search.js"></script>
    <script src="/script/date.js"></script>
    <script class="offlineScript" src="/script/weather.js"></script>
    <script src="/script/user.js"></script>
    <script class="offlineScript" src="/script/news.js"></script>
    <script src="/script/news-cat-change.js"></script>
    <script src="/script/socials.js"></script>
    <script src="/script/bookmarks.js"></script>
    <script src="/script/notepad.js"></script>
    <script src="/script/notepad-text-editor.js"></script>
    <script src="/script/gamesnotepadtodolist.js"></script>
    <script src="/script/backup.js"></script>
    <script src="/script/iframes.js"></script>
    <script src="/script/themes.js"></script>
    <script src="/script/focus/on.js"></script>
    <script src="/script/history.js"></script>
    <script src="/script/cursor.js"></script>

    
  </body>
</html>
