<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus mode</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="focusmode-widgets">
      <div id="audio-player" class="audio-player">
        <h3>Focus Music</h3>
        <audio id="audio" src=""></audio>
        <div id="current-song-title"></div>
        <input type="range" id="playback-slider" min="0" max="100" value="0" />

        <div class="controls">
          <button id="playPauseBtn">Play</button>
          <button id="skipBtn">Skip</button>
        </div>
        <div class="volume-control">
          <label for="volume">Volume:</label>
          <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="0.5" />
        </div>
        <select id="track-select">
          <option value="">Select a track</option>
          <option value="/focusmode/assets/music/Alone-Two-Days-Ago.mp3">
            Alone Two Days Ago
          </option>
          <option value="/focusmode/assets/music/Arnor.mp3">Arnor</option>
          <option
            value="/focusmode/assets/music/Evening-Improvisation-with-Ethera.mp3">
            Evening Improvisation with Ethera
          </option>
          <option value="/focusmode/assets/music/Moon-Dock.mp3">
            Moon Dock
          </option>
          <option value="/focusmode/assets/music/Study-and-Relax.mp3">
            Study and Relax
          </option>
          <option value="/focusmode/assets/music/Sunset-Landscape.mp3">
            Sunset Landscape
          </option>
          <option value="/focusmode/assets/music/Vibin.mp3">Vibin</option>
          <option value="/focusmode/assets/music/Bagatelle à Jacques.mp3">Bagatelle à Jacques</option>
          <option value="/focusmode/assets/music/Berceuse No. 01.mp3">Berceuse No. 01</option>
          <option value="/focusmode/assets/music/La premie.mp3">La premie</option>
          <option value="/focusmode/assets/music/Le sixičme péché.mp3">Le sixičme péché</option>
          <option value="/focusmode/assets/music/Minimal Piano No. 9.mp3">Minimal Piano No. 9</option>
          <option value="/focusmode/assets/music/Notre envol II.mp3">Notre envol II</option>
          <option value="/focusmode/assets/music/Pensées Nocturnes No. 03.mp3">Pensées Nocturnes No. 03</option>
          <option value="/focusmode/assets/music/Valse contre la mort.mp3">Valse contre la mort</option>
          <option value="/focusmode/assets/music/Water Drop.mp3">Water Drop</option>
          <option value="/focusmode/assets/music/Worries.mp3">Worries</option>
        </select>
      </div>
      <div id="pomodoro-container">
        <h2>Pomodoro Timer</h2>
        <div id="timer">25:00</div>
        <div id="controls">
          <button id="start">Start</button>
          <button id="pause">Pause</button>
          <button id="reset">Reset</button>
        </div>
        <div id="session-info">
          <span id="session-count">Session: 1
          <span id="session-type">Work
        </div>
      </div>
    </div>
    <div class="container">
      <div class="clock-container">
        <div class="clock">
          <div class="circle" id="sc" style="--clr: #04fc43"><i></i></div>
          <div class="circle circle2" id="mn" style="--clr: #fee800">
            <i></i>
          </div>
          <div class="circle circle3" id="hr" style="--clr: #ff2972">
            <i></i>
          </div>

          <span style="--i: 1"><b>1</b></span>
          <span style="--i: 2"><b>2</b></span>
          <span style="--i: 3"><b>3</b></span>
          <span style="--i: 4"><b>4</b></span>
          <span style="--i: 5"><b>5</b></span>
          <span style="--i: 6"><b>6</b></span>
          <span style="--i: 7"><b>7</b></span>
          <span style="--i: 8"><b>8</b></span>
          <span style="--i: 9"><b>9</b></span>
          <span style="--i: 10"><b>10</b></span>
          <span style="--i: 11"><b>11</b></span>
          <span style="--i: 12"><b>12</b></span>
        </div>
        <div id="time">
          <div id="hours" style="--clr: #ff2972">00</div>
          <div id="minutes" style="--clr: #fee800">00</div>
          <div id="seconds" style="--clr: #04fc43">00</div>
          <div id="ampm">AM</div>
        </div>
      </div>
      <div id="searchdiv">
        <form id="searchform">
          <input
            type="text"
            id="searchinput"
            placeholder="Search on Google"
            autocomplete="off" />
        </form>
      </div>
      <button id="exitFocusModeBtn">Exit Focus Mode</button>
    </div>

    <script src="/script/focus/off.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="/focusmode/assets/js/pomodoro.js"></script>
    <script src="/focusmode/assets/js/audio.js"></script>
  </body>
</html>
